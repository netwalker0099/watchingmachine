# Publishes a release when a version tag (v3.56, ...) is pushed: runs the
# tests, checks the tag matches the toc's version, cuts that version's notes
# from CHANGELOG.md, then the BigWigs packager builds the zip (see .pkgmeta)
# and uploads it to CurseForge (project from ## X-Curse-Project-ID in the
# toc, token from the CF_API_KEY secret) and as a GitHub release.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # A fixed image: "ubuntu-latest" moves to a new Ubuntu from time to time
    runs-on: ubuntu-24.04
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Lua 5.1 for the tests, built from lua.org's source (checksum checked).
      # It used to come from Ubuntu's package servers with apt-get, which
      # hung for half an hour and failed the 3.85 and 3.86 releases.
      - name: Lua 5.1 for the tests (built from source)
        id: lua
        continue-on-error: true
        timeout-minutes: 5
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 4 --retry-delay 5 --max-time 120 -o lua-5.1.5.tar.gz https://www.lua.org/ftp/lua-5.1.5.tar.gz
          echo "2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333  lua-5.1.5.tar.gz" | sha256sum -c -
          tar xzf lua-5.1.5.tar.gz
          make -C lua-5.1.5 posix
          echo "LUA=$RUNNER_TEMP/lua-5.1.5/src/lua" >> "$GITHUB_ENV"

      # Only if that didn't work: from apt, with short timeouts
      - name: Lua 5.1 from apt instead
        if: steps.lua.outcome != 'success'
        timeout-minutes: 6
        run: |
          opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $opts update || true
          sudo apt-get $opts install -y lua5.1
          echo "LUA=lua5.1" >> "$GITHUB_ENV"

      - name: Tests
        timeout-minutes: 10
        run: |
          "$LUA" -v
          sh tests/run.sh

      - name: The tag matches the toc's version
        run: |
          toc=$(sed -n 's/^## Version: *//p' WatchingMachine.toc | tr -d '\r')
          tag="${GITHUB_REF_NAME#v}"
          echo "toc $toc, tag $tag"
          test "$toc" = "$tag"

      - name: This version's release notes
        run: python3 -I tools/release_notes.py "$GITHUB_REF_NAME" > RELEASE_NOTES.md

      - uses: BigWigsMods/packager@v2
